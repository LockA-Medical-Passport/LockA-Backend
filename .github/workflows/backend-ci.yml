name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - "Backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "Backend/**"
      - ".github/workflows/backend-ci.yml"

# Cancel a run when a new push supersedes it on the same branch/PR.
concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: Backend

jobs:
  build-fmt-clippy-test:
    name: build, fmt, clippy, test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: locka
          POSTGRES_PASSWORD: locka
          POSTGRES_DB: locka_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U locka"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Available to every step (fmt/clippy don't use it; here for `cargo
      # test` and any DB-backed tests future issues add against it).
      DATABASE_URL: postgres://locka:locka@localhost:5432/locka_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        # Reads Backend/rust-toolchain.toml and installs that exact
        # channel + components (rustfmt, clippy) — the same toolchain
        # `cargo build` would auto-install locally, so CI can't drift
        # from what contributors run on their machines.
        run: rustup show

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "Backend -> target"

      - name: cargo fmt --check
        run: cargo fmt --check

      - name: cargo clippy -- -D warnings
        run: cargo clippy --workspace -- -D warnings

      - name: cargo test
        run: cargo test --workspace
