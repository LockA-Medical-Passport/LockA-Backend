[workspace]
resolver = "2"
members = [
    "api",
    "config",
    "domain",
    "soroban",
    "storage",
    "telemetry",
    "worker",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
# These crates are the internals of one deployed service, never registry
# artifacts. Marking them unpublishable blocks an accidental `cargo publish`
# and is what lets `cargo-deny` skip them when checking license policy (see
# `[licenses.private]` in deny.toml) — they carry no `license` field precisely
# because they are not distributed.
publish = false

[workspace.dependencies]
axum = "0.8.9"
config = { path = "config" }
dotenvy = "0.15.7"
envy = "0.4.2"
serde = { version = "1.0.229", features = ["derive"] }
telemetry = { path = "telemetry" }
tokio = "1.53.1"
tower = "0.5.3"
tower-http = "0.7.0"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = "0.3.23"
