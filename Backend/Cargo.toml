[workspace]
resolver = "2"
members = [
    "api",
    "config",
    "domain",
    "soroban",
    "storage",
    "telemetry",
    "worker",
]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
axum = "0.8.9"
telemetry = { path = "telemetry" }
tokio = "1.53.1"
tower = "0.5.3"
tower-http = "0.7.0"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = "0.3.23"
